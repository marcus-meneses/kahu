<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kahu - Gerência pet</title>
  </head>
  <body>
    <div id="root" style="zoom: 100%;"></div>
    <script>
      window.addEventListener("error", function (event) {
        var detail = String(event.error && event.error.message || event.message || "");
        if (!/service configuration|services\./i.test(detail)) return;
        var root = document.getElementById("root");
        if (root) root.innerHTML = '<main style="font:16px system-ui;padding:32px;color:#8b1e2d">Configuração de serviços inválida. Contate o administrador.</main>';
      });
    </script>
    <script src="/app-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
